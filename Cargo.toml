[workspace]
resolver = "2"
members = ["pleme-hotswap", "pleme-hotswap-derive", "gen"]

[workspace.package]
version = "0.1.2"
edition = "2024"
rust-version = "1.89.0"
license = "MIT"
repository = "https://github.com/pleme-io/pleme-hotswap-derive"
authors = ["pleme-io"]

[workspace.lints]

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"

[profile]

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
strip = true
