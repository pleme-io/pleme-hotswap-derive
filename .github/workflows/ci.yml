name: ci
on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
  workflow_dispatch: {}
jobs:
  build:
    name: build
    strategy:
      matrix:
        os:
        - macos-15
        - ubuntu-24.04
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@main
    - name: Flake check
      run: nix flake check
    - name: cargo fmt
      run: cargo fmt --all -- --check
    - name: cargo test
      run: cargo test --workspace
    - name: Publish to crates.io
      run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
